grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name:  CLUSTER.medication.v2.substance
  version: 0.0.1-alpha 
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.medication.v2
    revision: 2.0.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Substance

mappings:
  - name: name
    with:
      fhir: $resource.code
      openehr: $archetype/items[at0132]

  - name: ingredients
    with:
      fhir: $resource.ingredient
      openehr: $archetype/items[openEHR-EHR-CLUSTER.medication.v2] # cluster in cluster
    followedBy:
      mappings:
        - name: ingredient
          with:
            fhir: substance.as(CodeableConcept)
            openehr: $archetype
          followedBy:
            mappings:
              - name: itemText
                with:
                  fhir: text
                  openehr: items[at0132]

              - name: wirkstofftyp
                with:
                  fhir: coding
                  openehr: items[at0142]

        - name: substanceSubstance
          with:
            fhir: substance
            openehr: $reference
          reference:
            resourceType: Substance
            mappings:
              - name: medicationSubstanceReference
                with:
                  fhir: $fhirRoot
                  openehr: $archetype/items[openEHR-EHR-CLUSTER.medication.v2]
                slotArchetype: CLUSTER.medication.v2.substance # depending on the resourceType picks the correct one

        - name: quantity
          with:
            fhir: quantity
            openehr: items[at0152]
          followedBy:
            mappings:
              - name: numerator
                with:
                  fhir: numerator
                  openehr: items[at0153]
              - name: denominator
                with:
                  fhir: denominator
                  openehr: items[at0157]

  - name: instance
    with:
      fhir: $resource.instance.quantity
      openehr: $archetype/items[at0115]

# unmapped openEHR  (archetype 2.0.1, CKM latest 2.0.6)
# items[at0003]                Expiry
# items[at0071]                Form
# items[at0127]                Role
# items[at0133]                Description
# items[at0139]                Amount
# items[at0148]                Alternate amount
# items[at0150]                Batch ID
# items[at0151]                Manufacturer
# items[at0152]/items[at0153]  Strength numerator    referenced with a different path, check
# items[at0152]/items[at0157]  Strength denominator  referenced with a different path, check
# unmapped FHIR  (Substance R4)
# Substance.identifier
# Substance.status
# Substance.category
# Substance.description
