          operator: one of
          criteria: unconfirmed

        fhir:
          - path: code
            value: unconfirmed
          - path: display
            value: Unconfirmed
          - path: system
            value: http://terminology.hl7.org/CodeSystem/condition-ver-status
        openehrCondition:
