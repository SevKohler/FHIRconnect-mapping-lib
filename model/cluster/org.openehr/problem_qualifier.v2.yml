grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name:  CLUSTER.problem_qualifier.v2
  version: 0.0.1-alpha 
spec: 
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.problem_qualifier.v2
    revision: 2.0.1
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BackboneElement

mappings:
  - name: statusCoded
    with:
      fhir: $resource.verificationStatus.coding
      openehr: $archetype/items[at0004]
    fhirCondition:
      targetRoot: $resource.verificationStatus
      targetAttribute: coding.code
      operator: not of
      criteria: entered-in-error
    manual:
      - name: provisional
        openehr:
          - path: defining_code/terminology_id
            value: local
          - path: defining_code/code_string
            value: at0017
          - path: value
            value: Working
        fhirCondition:
          targetRoot: $fhirRoot
          targetAttribute: code
          operator: one of
          criteria: provisional

        fhir:
          - path: code
            value: provisional
          - path: display
            value: Provisional
          - path: system
            value: http://terminology.hl7.org/CodeSystem/condition-ver-status
        openehrCondition:
          targetRoot: $archetype
          targetAttribute: items[at0004]/defining_code/code_string
          operator: one of
          criteria: at0017

      - name: differential
        openehr:
          - path: defining_code/terminology_id
            value: local
          - path: defining_code/code_string
            value: at0017
          - path: value
            value: Working
