grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: CLUSTER.person_birth_data_iso.v0
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  openEhrConfig:
    archetype: openEHR-EHR-CLUSTER.person_birth_data_iso.v0
    revision: 0.0.1-alpha
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/BackboneElement

mappings:
  - name: birthdate
    with:
      fhir: $fhirRoot
      openehr: $archetype/items[at0001]

# unmapped openEHR  (archetype 0.0.1-alpha)
# items[at0002]  Country of birth
# items[at0003]  Birth plurality
# items[at0004]  Birth order
# items[at0005]  Date of birth follow-up indicator
