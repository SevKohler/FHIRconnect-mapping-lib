# activities[at0001]/description[at0009]/items[at0062]  Reason for request
# activities[at0001]/description[at0009]/items[at0064]  Reason description
# activities[at0001]/description[at0009]/items[at0068]  Urgency
# activities[at0001]/description[at0009]/items[at0076]  Supplementary information
# activities[at0001]/description[at0009]/items[at0078]  Information description
# activities[at0001]/description[at0009]/items[at0135]  Description
# activities[at0001]/description[at0009]/items[at0152]  Clinical indication
# activities[at0001]/description[at0009]/items[at0153]  Order detail
# activities[at0001]/description[at0009]/items[at0154]  Clinical context
# protocol[at0008]/items[at0011]                        Receiver order identifier
# protocol[at0008]/items[at0156]                        Billing guidance
# protocol[at0008]/items[at0158]                        Eligibility guidance
