grammar: FHIRConnect/v1.0.0
type: context
metadata:
  name: eehrxf_lab.context
  version: 0.0.1a
spec:
  system: FHIR
  version: R4

# Example: the EEHRxF Lab context, extended to also emit a Provenance.
# The only addition vs. the original lab.context.yml is the `operational:` block.
# See provenance.yml + provenance-decisions.md (arc42 §9) for the model itself.

context:
  profile:
    url: "http://hl7.eu/fhir/laboratory/StructureDefinition/DiagnosticReport-eu-lab"
    version: "0.1.1"
  template:
    id: "EHDS - Laboratory report"
    sem_ver: "0.1.0"
  operational:
    - "provenance"
  archetypes:
    - "CLUSTER.laboratory_test_analyte.v1"
    - "CLUSTER.specimen.v1"
    - "OBSERVATION.laboratory_test_result.v1"
    - "COMPOSITION.report-result.v1.DiagnosticReport"
  extensions:
    - "eehrxf_lab_result"
    - "eehrxf_lab_analyte"
    - "provenance_who_context"
  start: "OBSERVATION.laboratory_test_result.v1"
