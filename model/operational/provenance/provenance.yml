grammar: FHIRConnect/v1.0.0
type: model
metadata:
  name: provenance
  version: 0.0.1-alpha
spec:
  system: FHIR
  version: R4
  unidirectional: "openehr->fhir"
  fhirConfig:
    structureDefinition: http://hl7.org/fhir/StructureDefinition/Provenance


# ── Provenance (operational model) ───────────────────────────────────────────
# Records that a set of FHIR resources was produced by the FHIRconnect engine
# from one or more source openEHR compositions, giving each output an auditable
# link back to where it came from. Generated by the engine as a side-effect of
# every run (no openEhrConfig — not derived from an archetype).
#
# Rationale for every choice below lives in provenance-decisions.md (arc42 §9).
#
# Field sources:
#   ENGINE    (runtime, not in YAML)  target[], id, recorded, entity[] iteration,
#                                     entity.what.identifier.value
#   DEFAULTED (manual literals below) policy, reason, activity, agent.type,
#                                     entity.role, identifier.system, display
#   CONTEXT   (optional per-call)     agent.who override, agent.onBehalfOf
#                                     (else who defaults to the engine's Device)

mappings:
  - name: "policy"
    with:
      fhir: "$resource.policy"
    manual:
      - name: "policy"
        fhir:
          - path: "$fhirRoot"
            value: "urn:ihe:pcc:qedm:2017:document-provenance-policy"

  - name: "reason"
    with:
      fhir: "$resource.reason.text"
    manual:
      - name: "reasonText"
        fhir:
          - path: "$fhirRoot"
            value: "Transformed openEHR Composition to FHIR"

  - name: "activity"
    with:
      fhir: "$resource.activity.coding"
    manual:
      - name: "activityCoding"
        fhir:
          - path: "system"
            value: "http://hl7.org/fhir/w3c-provenance-activity-type"
          - path: "code"
            value: "Derivation"
          - path: "display"
            value: "wasDerivedFrom"

  - name: "agent"
    with:
      fhir: "$resource.agent.type.coding"
    manual:
      - name: "agentType"
        fhir:
          - path: "system"
            value: "http://terminology.hl7.org/CodeSystem/provenance-participant-type"
          - path: "code"
            value: "assembler"
          - path: "display"
            value: "Assembler"

  - name: "sourceEntity"
    with:
      fhir: "$resource.entity"
    followedBy:
      mappings:
        - name: "sourceEntityRole"
          with:
            fhir: "role"
          manual:
            - name: "role"
              fhir:
                - path: "$fhirRoot"
                  value: "source"

        - name: "sourceEntityWhat"
          with:
            fhir: "what"
          followedBy:
            mappings:
              - name: "sourceEntityIdentifierSystem"
                with:
                  fhir: "identifier.system"
                manual:
                  - name: "system"
                    fhir:
                      - path: "$fhirRoot"
                        value: "http://openehr.org/fhir/NamingSystem/ObjectLocation" #Placeholder for now

              # Static default; may be overridden downstream via extension.
              - name: "sourceEntityDisplay"
                with:
                  fhir: "display"
                manual:
                  - name: "display"
                    fhir:
                      - path: "$fhirRoot"
                        value: "International Patient Summary"